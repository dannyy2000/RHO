            contract-id: ST14V779KZH7Q62TXJ1G6HZBP23PJT6CE25RFESB7.rho-core-v3
            expected-sender: ST14V779KZH7Q62TXJ1G6HZBP23PJT6CE25RFESB7
            method: accept-offer
            parameters:
              - u2
              - u700000
            cost: 120000
      epoch: "2.1"

    # Cycle 10 rate is 465,831, below the 600,000 fixed rate, so the variable
    # party owes 134,169 and is then left under the maintenance margin.
    - id: 3
      transactions:
