    # margin on the two cycles that would remain.
    - id: 2
      transactions:
        - contract-call:
            contract-id: ST14V779KZH7Q62TXJ1G6HZBP23PJT6CE25RFESB7.rho-core-v3
            expected-sender: ST14V779KZH7Q62TXJ1G6HZBP23PJT6CE25RFESB7
