            expected-sender: ST14V779KZH7Q62TXJ1G6HZBP23PJT6CE25RFESB7
            method: post-offer
            parameters:
              - u1000000000000
              - u500000
              - u3
              - u10000000
            cost: 120000
        - contract-call:
            contract-id: ST14V779KZH7Q62TXJ1G6HZBP23PJT6CE25RFESB7.rho-core-v3
            expected-sender: ST14V779KZH7Q62TXJ1G6HZBP23PJT6CE25RFESB7
            method: accept-offer
            parameters:
              - u1
              - u10000000
